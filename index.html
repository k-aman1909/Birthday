<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<style>
  :root{
    --dusk: #2b1620;
    --dusk-deep: #1a0d13;
    --rose: #d88a9a;
    --rose-deep: #b85c72;
    --rose-pale: #f2c9d3;
    --paper: #ede1c8;
    --paper-shadow: #cbb896;
    --ink: #3a2a20;
    --gold: #c9a15a;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #3a1f2c 0%, var(--dusk) 45%, var(--dusk-deep) 100%);
    font-family: 'Iowan Old Style','Palatino Linotype', Georgia, serif;
    color: var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
  }

  /* ambient floating specks */
  .spark{
    position:fixed;
    width:3px;height:3px;
    background: var(--rose-pale);
    border-radius:50%;
    opacity:.5;
    filter: blur(0.5px);
    animation: float 9s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0) translateX(0); opacity:.15;}
    50%{ transform: translateY(-40px) translateX(10px); opacity:.7;}
  }

  .stage{
    position:relative;
    width:100%;
    max-width:640px;
    padding: 40px 20px 80px;
    text-align:center;
  }

  h1.title{
    font-family: 'Snell Roundhand','Brush Script MT', cursive;
    font-weight:400;
    font-size: clamp(28px, 6vw, 42px);
    color: var(--rose-pale);
    letter-spacing: 1px;
    margin: 0 0 36px;
    opacity:.9;
  }

  /* ---------- ENVELOPE ---------- */
  .envelope-wrap{
    display:flex;
    justify-content:center;
    perspective: 1000px;
  }

  .envelope{
    position:relative;
    width: min(90vw, 460px);
    height: min(60vw, 300px);
    cursor:pointer;
    transition: transform .5s ease;
  }
  .envelope:hover{ transform: translateY(-4px); }
  .envelope.opened{ cursor:default; }

  .env-body{
    position:absolute; inset:0;
    background: linear-gradient(160deg, var(--rose) 0%, var(--rose-deep) 100%);
    border-radius: 6px;
    box-shadow: 0 20px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.15);
  }

  .env-shadow-fold{
    position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(0,0,0,.14) 0%, transparent 35%, transparent 65%, rgba(0,0,0,.18) 100%);
    border-radius:6px;
    pointer-events:none;
  }

  /* bottom triangle fold (static) */
  .env-body::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:0;
    border-left: 230px solid transparent;
    border-right: 230px solid transparent;
    border-bottom: 135px solid rgba(0,0,0,.12);
    top: auto;
  }

  .flap{
    position:absolute;
    top:0; left:0; right:0;
    height:55%;
    background: linear-gradient(160deg, var(--rose-deep), #a04960);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1.1s cubic-bezier(.65,0,.35,1);
    z-index:5;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }
  .envelope.opened .flap{
    transform: rotateX(180deg);
    z-index:1;
  }

  .heart-seal{
    position:absolute;
    top: 40%;
    left:50%;
    transform: translate(-50%,-50%);
    font-size: 52px;
    z-index: 6;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.4));
    animation: pulse 1.8s ease-in-out infinite;
    transition: opacity .4s ease;
  }
  .envelope.opened .heart-seal{ opacity:0; }
  @keyframes pulse{
    0%,100%{ transform: translate(-50%,-50%) scale(1); }
    50%{ transform: translate(-50%,-50%) scale(1.12); }
  }

  .hint{
    margin-top:18px;
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color: var(--rose-pale);
    opacity:.55;
  }
  .envelope-wrap.opened + .hint{ opacity:0; }

  /* ---------- BURNT PAPER NOTE ---------- */
  .note-wrap{
    max-width: 480px;
    margin: 46px auto 0;
    opacity:0;
    transform: translateY(-260px) scale(.2) rotate(-3deg);
    pointer-events:none;
    transition: opacity .9s ease, transform 1.1s cubic-bezier(.2,.7,.25,1);
  }
  .note-wrap.show{
    opacity:1;
    transform: translateY(0) scale(1) rotate(0deg);
    pointer-events:auto;
  }

  .note{
    position:relative;
    background:
      radial-gradient(circle at 15% 10%, rgba(90,55,20,.18), transparent 40%),
      radial-gradient(circle at 90% 95%, rgba(90,55,20,.2), transparent 45%),
      linear-gradient(160deg, #efe2c4, #e3d3ab 60%, #d9c592);
    padding: 46px 38px;
    color: var(--ink);
    font-size: 16px;
    line-height:1.75;
    text-align:left;
    box-shadow: 0 25px 45px rgba(0,0,0,.4);
    clip-path: polygon(
      0% 14%, 3% 9%, 1% 6%, 6% 7%, 5% 2%, 9% 4%, 8% 0%,
      30% 0%, 70% 0%,
      92% 0%, 93% 4%, 96% 2%, 95% 6%, 99% 5%, 97% 9%, 100% 14%,
      100% 40%, 100% 60%,
      100% 86%, 97% 91%, 99% 94%, 95% 93%, 96% 97%, 93% 96%, 92% 100%,
      70% 100%, 30% 100%,
      8% 100%, 9% 96%, 5% 98%, 6% 94%, 1% 95%, 3% 91%, 0% 86%,
      0% 60%, 0% 40%
    );
  }

  .note::before{
    /* scorch color only at the four corners - never covers the text */
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 0% 0%, rgba(40,18,4,.85) 0%, rgba(90,45,10,.5) 8%, transparent 22%),
      radial-gradient(circle at 100% 0%, rgba(40,18,4,.85) 0%, rgba(90,45,10,.5) 8%, transparent 22%),
      radial-gradient(circle at 100% 100%, rgba(40,18,4,.85) 0%, rgba(90,45,10,.5) 8%, transparent 22%),
      radial-gradient(circle at 0% 100%, rgba(40,18,4,.85) 0%, rgba(90,45,10,.5) 8%, transparent 22%);
    mix-blend-mode: multiply;
    clip-path: inherit;
  }

  .note p{
    margin:0 0 14px;
    font-family: 'Iowan Old Style', Georgia, serif;
    white-space: pre-wrap;
  }
  .note p:last-child{ margin-bottom:0; }

  .note p.typing::after{
    content:"";
    display:inline-block;
    width:2px;
    height:1em;
    background: var(--ink);
    margin-left:2px;
    vertical-align:-2px;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0; }
  }

  .note .signoff{
    font-family: 'Snell Roundhand','Brush Script MT', cursive;
    font-size: 22px;
    margin-top: 20px;
    color: var(--rose-deep);
  }

  /* ---------- QUESTION ---------- */
  .question-wrap{
    margin-top: 50px;
    opacity:0;
    transform: translateY(20px);
    transition: opacity .8s ease .3s, transform .8s ease .3s;
  }
  .question-wrap.show{ opacity:1; transform:translateY(0); }

  .question{
    font-size: clamp(19px,4vw,24px);
    color: var(--paper);
    margin-bottom: 30px;
    font-style: italic;
  }

  .btn-row{
    position:relative;
    display:flex;
    justify-content:center;
    gap: 26px;
    min-height: 70px;
  }

  button.choice{
    font-family: inherit;
    font-size: 17px;
    padding: 14px 34px;
    border-radius: 999px;
    border: none;
    cursor:pointer;
    letter-spacing:.5px;
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .btn-yes{
    background: linear-gradient(135deg, var(--gold), #a97b34);
    color: #2b1608;
    font-weight:600;
    box-shadow: 0 10px 24px rgba(201,161,90,.35);
  }
  .btn-yes:hover{ transform: translateY(-2px) scale(1.03); }

  .btn-no{
    background: linear-gradient(135deg, #6b4552, #4a2e38);
    color: var(--rose-pale);
    border: none;
    font-weight:600;
    box-shadow: 0 10px 24px rgba(0,0,0,.35);
    position: relative;
    transition: transform .18s ease, left .18s ease, top .18s ease;
  }

  .btn-no.escaping{
    position: fixed;
    z-index: 50;
  }

  /* ---------- FINALE ---------- */
  .finale{
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at center, rgba(43,22,32,.97), rgba(15,7,11,.99));
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 30px;
    opacity:0;
    pointer-events:none;
    transition: opacity .6s ease;
    z-index: 100;
  }
  .finale.show{ opacity:1; pointer-events:auto; }

  /* ---------- HANGING PHOTO GALLERY ---------- */
  .photo-string{
    position:relative;
    width: min(94vw, 720px);
    max-width: 94vw;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold) 6%, var(--gold) 94%, transparent);
    box-shadow: 0 1px 3px rgba(0,0,0,.5);
    margin-bottom: 0;
    opacity:0;
    transition: opacity .5s ease;
  }
  .finale.show .photo-string{ opacity:1; }

  .photo-gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    gap: 18px;
    width: min(94vw, 760px);
    margin-top: -2px;
  }

  .hanging-photo{
    position:relative;
    width: min(30vw, 150px);
    transform-origin: top center;
    transform: scale(0) rotate(0deg);
    opacity:0;
    transition: transform .8s cubic-bezier(.34,1.56,.64,1), opacity .5s ease;
  }
  .finale.show .hanging-photo{ opacity:1; }
  .finale.show .hanging-photo:nth-child(1){ transform: scale(1) rotate(-6deg); transition-delay:.15s; }
  .finale.show .hanging-photo:nth-child(2){ transform: scale(1) rotate(4deg); transition-delay:.3s; }
  .finale.show .hanging-photo:nth-child(3){ transform: scale(1) rotate(-3deg); transition-delay:.45s; }
  .finale.show .hanging-photo:nth-child(4){ transform: scale(1) rotate(6deg); transition-delay:.6s; }
  .finale.show .hanging-photo:nth-child(5){ transform: scale(1) rotate(-5deg); transition-delay:.75s; }
  .finale.show .hanging-photo:nth-child(6){ transform: scale(1) rotate(3deg); transition-delay:.70s; }
  .finale.show .hanging-photo:nth-child(7){ transform: scale(1) rotate(-4deg); transition-delay:.80s; }
  .finale.show .hanging-photo:nth-child(8){ transform: scale(1) rotate(5deg); transition-delay:.82s; }

  .hanging-photo .ribbon{
    width: 10px;
    height: 26px;
    margin: 0 auto;
    background: linear-gradient(180deg, var(--gold), #a97b34);
    clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
    box-shadow: 0 2px 4px rgba(0,0,0,.4);
  }

  .hanging-photo img{
    display:block;
    width: 100%;
    aspect-ratio: 1 / 1;
    height:auto;
    object-fit: cover;
    border-radius: 6px;
    border: 4px solid #f3ecd8;
    box-shadow: 0 12px 24px rgba(0,0,0,.5);
    transform: none;
    transition: none;
  }

  .finale-text{
    margin-top: 36px;
  }

  .hanging-photo.photo-missing img{
    visibility: hidden;
  }
  .hanging-photo.photo-missing{
    position: relative;
  }
  .hanging-photo.photo-missing::after{
    content: "🤍";
    position:absolute;
    top: 26px; left:0; right:0; bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 34px;
    background: linear-gradient(160deg,#efe2c4,#d9c592);
    border-radius:6px;
    border: 4px solid #f3ecd8;
    box-shadow: 0 12px 24px rgba(0,0,0,.5);
  }

  .finale p{
    font-family: 'Snell Roundhand','Brush Script MT', cursive;
    font-size: clamp(26px,5.5vw,40px);
    color: var(--rose-pale);
    margin-top: 30px;
    opacity:0;
    transform: translateY(14px);
    transition: opacity .9s ease .5s, transform .9s ease .5s;
  }
  .finale.show p{ opacity:1; transform:translateY(0); }

  .close-finale{
    margin-top:26px;
    background:none;
    border:1px solid rgba(242,201,211,.4);
    color: var(--rose-pale);
    padding: 8px 22px;
    border-radius:999px;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    opacity:0;
    transition: opacity 1s ease .8s;
  }
  .finale.show .close-finale{ opacity:.7; }

  /* ---------- FALLING PETALS ---------- */
  .petal{
    position:fixed;
    top:-20px;
    font-size: 18px;
    opacity:.75;
    pointer-events:none;
    animation: petalFall linear infinite;
    z-index: 1;
  }
  @keyframes petalFall{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); }
    100%{ transform: translateY(110vh) translateX(var(--drift,40px)) rotate(360deg); }
  }

  /* ---------- ENVELOPE 3D TILT ---------- */
  .envelope-wrap{ perspective: 900px; }
  .envelope{ transform-style: preserve-3d; }

  /* ---------- NO BUTTON TAUNT BUBBLE ---------- */
  .no-taunt{
    position: fixed;
    z-index: 51;
    background: var(--paper);
    color: var(--ink);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 14px;
    box-shadow: 0 8px 18px rgba(0,0,0,.35);
    opacity:0;
    transform: translateY(6px) scale(.9);
    transition: opacity .25s ease, transform .25s ease;
    pointer-events:none;
    white-space:nowrap;
    font-family: 'Iowan Old Style', Georgia, serif;
    font-style: italic;
  }
  .no-taunt.show{
    opacity:1;
    transform: translateY(0) scale(1);
  }

  /* ---------- CONFETTI HEARTS ---------- */
  .confetti-heart{
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    pointer-events:none;
    z-index: 120;
    animation: heartRise 2.6s ease-in forwards;
  }
  @keyframes heartRise{
    0%{ transform: translateY(0) translateX(0) rotate(0deg) scale(1); opacity:1; }
    70%{ opacity:1; }
    100%{ transform: translateY(-100vh) translateX(var(--driftx,0px)) rotate(var(--spin,180deg)) scale(1.1); opacity:0; }
  }

  /* ---------- MUSIC TOGGLE ---------- */
  .music-toggle{
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a2020, #12070a 75%);
    border: 2px solid var(--gold);
    color: var(--gold);
    font-size: 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index: 200;
    box-shadow: 0 8px 20px rgba(0,0,0,.5);
    transition: transform .3s ease;
  }
  .music-toggle.spinning{
    animation: spinDisc 3.5s linear infinite;
  }
  @keyframes spinDisc{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }
  .music-toggle:hover{ transform: scale(1.08); }
</style>
</head>
<body>

<div class="stage">
  <h1 class="title">Bas Aise hi thora sa special feel krwane ki kosis ! Mera Kuchruuu</h1>

  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <div class="env-shadow-fold"></div>
      <div class="env-body"></div>
      <div class="heart-seal">❤️</div>
    </div>
  </div>
  <div class="hint" id="hint">Tap the envelope</div>

  <div class="note-wrap" id="noteWrap">
    <div class="note" id="noteText"></div>
  </div>

  <div class="question-wrap" id="questionWrap">
    <div class="question">Will you accept my apology?</div>
    <div class="btn-row">
      <button class="choice btn-no" id="btnNo">No</button>
      <button class="choice btn-yes" id="btnYes">Yes</button>
    </div>
  </div>
</div>

<div class="finale" id="finale">
  <div class="photo-string"></div>
  <div class="photo-gallery">
    <!-- ✍️ Replace each src below with your own photos (photo1.jpg ... photo5.jpg) -->
    <div class="hanging-photo"><div class="ribbon"></div><img src="1.jpeg" alt="memory 1"></div>
    <div class="hanging-photo"><div class="ribbon"></div><img src="2.jpg" alt="memory 2"></div>
    <div class="hanging-photo"><div class="ribbon"></div><img src="3.jpg" alt="memory 3"></div>
    <div class="hanging-photo"><div class="ribbon"></div><img src="4.jpg" alt="memory 4"></div>
    <div class="hanging-photo"><div class="ribbon"></div><img src="5.jpg" alt="memory 5"></div>
    <div class="hanging-photo"><div class="ribbon"></div><img src="6.jpg" alt="memory 5"></div>
    <div class="hanging-photo"><div class="ribbon"></div><img src="7.jpeg" alt="memory 5"></div>
    <div class="hanging-photo"><div class="ribbon"></div><img src="8.jpeg" alt="memory 5"></div>
  </div>
  <div class="finale-text">
    <p>Bas aise hi jaise har pic me has rhe ho naa aise hi hmesha haste rehna Shona. Bas yhi chata hu, kyuki aapke face par sadness acchii nhi lgti. Thank you! .</p>
    <button class="close-finale" id="closeFinale">close</button>
  </div>
</div>

<!-- ✍️ Replace src below with your own song file (or a URL to one) -->
<audio id="bgSong" src="tune.mp3" loop></audio>

<button class="music-toggle" id="musicToggle" aria-label="toggle music">♪</button>

<script>
  // ambient sparks
  const stage = document.body;
  for(let i=0;i<22;i++){
    const s = document.createElement('div');
    s.className='spark';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*6)+'s';
    s.style.animationDuration = (6+Math.random()*6)+'s';
    stage.appendChild(s);
  }

  // falling petals
  const petalEmojis = ['🌸','🌹','💮'];
  for(let i=0;i<16;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petalEmojis[Math.floor(Math.random()*petalEmojis.length)];
    p.style.left = Math.random()*100+'vw';
    p.style.setProperty('--drift', (Math.random()*160-80)+'px');
    p.style.animationDuration = (9+Math.random()*8)+'s';
    p.style.animationDelay = (Math.random()*10)+'s';
    p.style.fontSize = (14+Math.random()*10)+'px';
    stage.appendChild(p);
  }

  // graceful fallback for the gallery photos until real files are added
  document.querySelectorAll('.hanging-photo img').forEach(img => {
    img.addEventListener('error', function(){
      this.closest('.hanging-photo').classList.add('photo-missing');
    }, { once:true });
  });

  const envelope = document.getElementById('envelope');
  const envelopeWrap = document.getElementById('envelopeWrap');

  // 3D tilt following the cursor
  let tiltActive = true;
  envelopeWrap.addEventListener('mousemove', (e) => {
    if(!tiltActive) return;
    const rect = envelope.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const dx = (e.clientX - cx) / (rect.width/2);
    const dy = (e.clientY - cy) / (rect.height/2);
    envelope.style.transform = `rotateY(${dx*12}deg) rotateX(${-dy*12}deg)`;
  });
  envelopeWrap.addEventListener('mouseleave', () => {
    envelope.style.transform = 'rotateY(0deg) rotateX(0deg)';
  });
  const hint = document.getElementById('hint');
  const noteWrap = document.getElementById('noteWrap');
  const questionWrap = document.getElementById('questionWrap');
  const song = document.getElementById('bgSong');
  let opened = false;

  // ✍️ Replace these lines with your own note — one entry per paragraph
 const noteParagraphs = [
  "Hi Shonu,",

  "I know I've made mistakes that hurt you, and I truly regret them. I'm not writing this to ask for forgiveness—I just wanted to tell you something I've been meaning to say for a long time.",

  "Don't read this too seriously, okay? 😅 You can call me stupid or silly if you want.",

  "You mean more to me than you know. You're like the morning that brings light and the moon that makes even the darkest nights feel calm.",

  "Without you, everything feels a little empty. With you, life just feels better.",

  "Just stay in my life, even if it's only as someone who genuinely cares about me. Knowing you're there gives me strength on my difficult days.",

  "You may get angry or scold me, but I know you always want what's best for me, and I truly value that.",

  "No matter what happens or how much we argue, you'll always be one of the most special people in my life.",

  "Take care, always. ❤️"
];
  const noteSignoff = "— Aapka apna Wafadar Gadha 🐴";

  const noteTextEl = document.getElementById('noteText');
  const TYPE_SPEED = 26; // ms per letter

  function typeNote(onDone){
    let pIndex = 0;

    function typeParagraph(){
      if(pIndex >= noteParagraphs.length){
        const sign = document.createElement('p');
        sign.className = 'signoff';
        noteTextEl.appendChild(sign);
        let i = 0;
        const text = noteSignoff;
        (function typeSignoff(){
          if(i < text.length){
            sign.textContent += text[i];
            i++;
            setTimeout(typeSignoff, TYPE_SPEED);
          } else if(onDone){
            onDone();
          }
        })();
        return;
      }

      const p = document.createElement('p');
      p.className = 'typing';
      noteTextEl.appendChild(p);
      const text = noteParagraphs[pIndex];
      let charIndex = 0;

      (function typeChar(){
        if(charIndex < text.length){
          p.textContent += text[charIndex];
          charIndex++;
          setTimeout(typeChar, TYPE_SPEED);
        } else {
          p.classList.remove('typing');
          pIndex++;
          setTimeout(typeParagraph, 50);
        }
      })();
    }

    typeParagraph();
  }

  envelope.addEventListener('click', () => {
    if(opened) return;
    opened = true;
    tiltActive = false;
    envelope.style.transform = 'rotateY(0deg) rotateX(0deg)';
    envelope.classList.add('opened');
    envelopeWrap.classList.add('opened');
    hint.style.opacity = '0';

    song.play().catch(()=>{ /* browser may block autoplay until interaction; this click counts as interaction */ });

    setTimeout(()=>{
      noteWrap.classList.add('show');
      setTimeout(()=>{
        typeNote(() => {
          questionWrap.classList.add('show');
        });
      }, 700); // let the paper finish rising before typing starts
    }, 500);
  });

  // evasive No button
  const btnNo = document.getElementById('btnNo');
  const btnYes = document.getElementById('btnYes');

  const taunts = [
    "try again bua 😏", "aree itnaa jldi!", "kyaa har time nahi nahi", "are mera guguuu",
    "nahi milega itni aasani se kuchruuu", "haha", "ek aur try karo",
    "kabhi nahi 😌", "so close, yet so far", "keep trying bhuddhu"
  ];
  let taunt;

  function showTaunt(x, y, btnW){
    if(!taunt){
      taunt = document.createElement('div');
      taunt.className = 'no-taunt';
      document.body.appendChild(taunt);
    }
    taunt.textContent = taunts[Math.floor(Math.random()*taunts.length)];
    taunt.style.left = (x + btnW/2 - 60) + 'px';
    taunt.style.top = (y - 34) + 'px';
    taunt.classList.add('show');
    clearTimeout(taunt._hideTimer);
    taunt._hideTimer = setTimeout(()=> taunt.classList.remove('show'), 3000);
  }

  function dodge(){
    const w = window.innerWidth, h = window.innerHeight;

    // move the button straight into <body> the first time it dodges.
    // this guarantees position:fixed is measured against the real
    // viewport, not against a parent that has its own CSS transform
    // (which would silently turn "fixed" into "fixed relative to that
    // parent" and let the button drift off-screen / grow page height)
    if(!btnNo.classList.contains('escaping')){
      document.body.appendChild(btnNo);
      btnNo.classList.add('escaping');
    }

    const btnW = btnNo.offsetWidth, btnH = btnNo.offsetHeight;
    const margin = 20;
    const maxX = w - btnW - margin;
    // keep it within the top ~65% of the viewport so it never wanders
    // down near the bottom edge (which can add scroll space) and stays
    // easily visible at all times
    const minY = margin;
    const maxY = Math.max(minY + 40, h * 0.65 - btnH);
    const x = Math.max(margin, Math.random()*maxX);
    const y = minY + Math.random()*(maxY - minY);

    btnNo.style.left = x + 'px';
    btnNo.style.top = y + 'px';
    showTaunt(x, y, btnW);
  }

  btnNo.addEventListener('mouseenter', dodge);
  btnNo.addEventListener('touchstart', (e)=>{ e.preventDefault(); dodge(); }, {passive:false});
  btnNo.addEventListener('click', (e)=>{ e.preventDefault(); dodge(); });

  const finale = document.getElementById('finale');

  function burstHearts(){
    const emojis = ['❤️','💖','💗','💕'];
    for(let i=0;i<40;i++){
      const h = document.createElement('div');
      h.className = 'confetti-heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = Math.random()*100+'vw';
      h.style.fontSize = (16+Math.random()*18)+'px';
      h.style.setProperty('--driftx', (Math.random()*200-100)+'px');
      h.style.setProperty('--spin', (Math.random()*360-180)+'deg');
      h.style.animationDelay = (Math.random()*0.6)+'s';
      h.style.animationDuration = (2.2+Math.random()*1.4)+'s';
      document.body.appendChild(h);
      setTimeout(()=> h.remove(), 4200);
    }
  }

  btnYes.addEventListener('click', () => {
    finale.classList.add('show');
    burstHearts();
  });

  document.getElementById('closeFinale').addEventListener('click', ()=>{
    finale.classList.remove('show');
  });

  // music mute/unmute toggle (spins like a vinyl while playing)
  const musicToggle = document.getElementById('musicToggle');
  function updateToggleUI(){
    if(song.paused){
      musicToggle.classList.remove('spinning');
      musicToggle.textContent = '♪';
    } else {
      musicToggle.classList.add('spinning');
      musicToggle.textContent = '♫';
    }
  }
  musicToggle.addEventListener('click', () => {
    if(song.paused){
      song.play().catch(()=>{});
    } else {
      song.pause();
    }
    updateToggleUI();
  });
  song.addEventListener('play', updateToggleUI);
  song.addEventListener('pause', updateToggleUI);
</script>

</body>
</html>
